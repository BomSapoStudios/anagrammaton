name: Anagrammaton
options:
  bundleIdPrefix: com.bomsapostudios
  deploymentTarget:
    iOS: "16.0"
packages:
  AnagrammatonCore:
    path: Core
targets:
  Anagrammaton:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: data
        buildPhase: resources
        excludes:
          - README.md
    dependencies:
      - package: AnagrammatonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bomsapostudios.anagrammaton
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anagrammaton
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme: {}
